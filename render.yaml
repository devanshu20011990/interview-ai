# ─────────────────────────────────────────────────────────────
#  Render deployment blueprint for Interview AI Assistant
#  Render auto-detects this file and sets up the web service.
#  You'll add your secret keys in the Render dashboard (not here).
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: interview-ai-assistant
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Render provides PORT automatically; the app already reads process.env.PORT.
      - key: OPENAI_API_KEY
        sync: false        # you enter this securely in the dashboard
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: TAVILY_API_KEY
        sync: false        # optional; leave blank to use Keyless search
